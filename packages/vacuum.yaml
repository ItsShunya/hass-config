# Robot vacuum (Dreame D10 Plus, dreame.vacuum.r2205, via Xiaomi Miot).
# Used by the Cleaning view (cards/vacuum_map.yaml).

input_text:
  # Rooms picked on the Cleaning view, in order, e.g. "7,4".
  vacuum_rooms:
    name: Vacuum rooms
    icon: mdi:floor-plan
    max: 100

script:
  vacuum_toggle_room:
    alias: Vacuum - pick room
    description: Pick or unpick a room on the Cleaning view.
    icon: mdi:gesture-tap
    mode: queued
    fields:
      room:
        description: Room segment id.
        required: true
        example: 7
        selector:
          number:
            min: 1
            max: 99
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.vacuum_rooms
        data:
          value: >-
            {%- set id = room | string -%}
            {%- set picked = states('input_text.vacuum_rooms').split(',')
              | reject('in', ['', 'unknown', 'unavailable']) | list -%}
            {{ (picked | reject('eq', id) | list if id in picked else picked + [id]) | join(',') }}

  vacuum_start:
    alias: Vacuum - start
    description: Clean the picked rooms, or the whole house if none are picked.
    icon: mdi:play
    sequence:
      - variables:
          rooms: >-
            {{ states('input_text.vacuum_rooms').split(',')
              | reject('in', ['', 'unknown', 'unavailable']) | map('int') | list }}
      - if: "{{ rooms | count > 0 }}"
        then:
          - action: script.vacuum_clean_rooms
            data:
              rooms: "{{ rooms }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.vacuum_rooms
            data:
              value: ""
        else:
          - action: vacuum.start
            target:
              entity_id: vacuum.robot_vacuum

  # vacuum.stop only pauses on Dreame, this ends the clean (siid 4, aiid 2).
  vacuum_stop:
    alias: Vacuum - stop
    description: Stop cleaning.
    icon: mdi:stop
    sequence:
      - action: xiaomi_miot.call_action
        data:
          entity_id: vacuum.robot_vacuum
          siid: 4
          aiid: 2

  # Both call the MIoT "start-clean" action (siid 4, aiid 1). piid 1 is the
  # work mode (18 = rooms, 19 = zone) and piid 10 the task as a JSON string,
  # with suction 1 (Standard) and water 2 (Medium):
  #   rooms: [room_id, repeats, suction, water, order]
  #   zone:  [x1, y1, x2, y2, repeats, suction, water]
  #
  # params is one template on purpose: Home Assistant parses a template that
  # renders to JSON into a dict, but piid 10 has to stay a string. Nested
  # inside the list, it does.
  vacuum_clean_rooms:
    alias: Vacuum - clean rooms
    description: Clean one or more rooms, in the given order.
    icon: mdi:floor-plan
    fields:
      rooms:
        description: Room segment id, or a list of them.
        required: true
        example: "[4, 7]"
        selector:
          object:
      repeats:
        description: Passes over each room.
        default: 1
        selector:
          number:
            min: 1
            max: 3
    sequence:
      - action: xiaomi_miot.call_action
        data:
          entity_id: vacuum.robot_vacuum
          siid: 4
          aiid: 1
          params: >-
            {%- set ids = rooms if rooms is list else [rooms] -%}
            {%- set ns = namespace(selects=[]) -%}
            {%- for id in ids -%}
              {%- set ns.selects = ns.selects + [[id | int, repeats | default(1) | int, 1, 2, loop.index]] -%}
            {%- endfor -%}
            {{ [{'piid': 1, 'value': 18}, {'piid': 10, 'value': {'selects': ns.selects} | to_json}] }}
          force_params: true

  # Not on the dashboard.
  vacuum_clean_zone:
    alias: Vacuum - clean zone
    description: Clean one or more rectangular zones, given in map coordinates.
    icon: mdi:select-drag
    fields:
      zone:
        description: Rectangle [x1, y1, x2, y2] in map coordinates, or a list of them.
        required: true
        example: "[[-7000, 650, -5700, 2000]]"
        selector:
          object:
      repeats:
        description: Passes over each zone.
        default: 1
        selector:
          number:
            min: 1
            max: 3
    sequence:
      - action: xiaomi_miot.call_action
        data:
          entity_id: vacuum.robot_vacuum
          siid: 4
          aiid: 1
          params: >-
            {%- set zones = zone if zone[0] is list else [zone] -%}
            {%- set ns = namespace(areas=[]) -%}
            {%- for z in zones -%}
              {%- set ns.areas = ns.areas + [(z | map('int') | list) + [repeats | default(1) | int, 1, 2]] -%}
            {%- endfor -%}
            {{ [{'piid': 1, 'value': 19}, {'piid': 10, 'value': {'areas': ns.areas} | to_json}] }}
          force_params: true

automation:
  - id: vacuum_rooms_forget
    alias: Vacuum - forget picked rooms
    description: Clear the picked rooms if nothing starts within 10 minutes.
    triggers:
      - trigger: state
        entity_id: input_text.vacuum_rooms
        to: ~
        for: "00:10:00"
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.vacuum_rooms
        data:
          value: ""

  # WhatsApp notifications, see docs/notifications.md.
  - id: vacuum_notify_run
    alias: Vacuum - notify start and finish
    description: Send a WhatsApp message when the vacuum starts cleaning and when it's done.
    # Runs for the whole clean, so carrying on after a recharge isn't a new start.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: vacuum.robot_vacuum
        from:
          - docked
          - idle
        to: cleaning
    actions:
      - action: notify.whatsapp
        data:
          target: !secret whatsapp_group
          message: "Vacuum: started cleaning"
      # On big cleans it docks halfway to recharge, with a low battery. Only a
      # dock with more than 20% left means it's done.
      - repeat:
          sequence:
            - wait_for_trigger:
                - trigger: state
                  entity_id: vacuum.robot_vacuum
                  to: docked
                  not_from:
                    - unknown
                    - unavailable
              timeout: "08:00:00"
              continue_on_timeout: false
          until: "{{ states('sensor.robot_vacuum_battery') | int(0) > 20 }}"
      - action: notify.whatsapp
        data:
          target: !secret whatsapp_group
          message: "Vacuum: finished"

  - id: vacuum_notify_stuck
    alias: Vacuum - notify stuck
    description: Send a WhatsApp message when the vacuum stops with an error, or is left off the dock.
    triggers:
      - trigger: state
        id: error
        entity_id: vacuum.robot_vacuum
        to: error
        not_from:
          - unknown
          - unavailable
      - trigger: state
        id: off_dock
        entity_id: vacuum.robot_vacuum
        to:
          - idle
          - paused
        for: "00:30:00"
    actions:
      - action: notify.whatsapp
        data:
          target: !secret whatsapp_group
          # The integration only gives the error as a number, so check the app.
          message: >-
            {{ 'Vacuum: stuck, check the Xiaomi Home app' if trigger.id == 'error'
              else 'Vacuum: off the dock for 30 minutes' }}

  - id: vacuum_consumable_low
    alias: Vacuum - consumable running low
    description: Send a WhatsApp message when a brush or the filter is under 10% life.
    # The sensors are hours left, so 10% of each part's life: 300 h main brush,
    # 200 h side brush, 150 h filter. Fires again after you reset it.
    triggers:
      - trigger: numeric_state
        id: Main brush
        entity_id: sensor.robot_vacuum_main_brush_left
        below: 30
      - trigger: numeric_state
        id: Side brush
        entity_id: sensor.robot_vacuum_side_brush_left
        below: 20
      - trigger: numeric_state
        id: Filter
        entity_id: sensor.robot_vacuum_filter_left
        below: 15
    actions:
      - action: notify.whatsapp
        data:
          target: !secret whatsapp_group
          message: >-
            Vacuum: {{ trigger.id | lower }} has {{ trigger.to_state.state }} hours left.
            Replace or clean it, then reset it in the Xiaomi Home app.
