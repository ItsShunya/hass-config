# Who is home, shown in the sidebar (cards/sidebar/bottom.yaml).
#
# Someone is home if their phone is in the home zone or on the home Wi-Fi.
# Nobody is listed here: custom_templates/presence.jinja finds the people and
# their phones. See docs/presence.md.
#
# The Wi-Fi names are in secrets.yaml under `home_wifi`, since a network's
# name can be looked up on a map.

template:
  - variables:
      home_wifi: !secret home_wifi
    sensor:
      # State: how many people are home.
      # people: each person and whether they're home, e.g. {'person.alice': true}.
      - name: People home
        unique_id: people_home
        icon: mdi:home-account
        state: >-
          {% from 'presence.jinja' import presence %}
          {{ (presence(home_wifi) | from_json).values() | select | list | count }}
        attributes:
          people: >-
            {% from 'presence.jinja' import presence %}
            {{ presence(home_wifi) | from_json }}

  # The glance card in the sidebar needs a fixed list of entities, so it shows
  # these four slots. Slot N is the Nth person in sensor.people_home; empty
  # slots are unavailable and hidden.
  - variables:
      slot: 1
    binary_sensor:
      - &slot
        name: Presence 1
        unique_id: presence_1
        device_class: presence
        availability: >-
          {{ (state_attr('sensor.people_home', 'people') or {}) | count >= slot }}
        picture: >-
          {% set people = (state_attr('sensor.people_home', 'people') or {}) | list %}
          {{ state_attr(people[slot - 1], 'entity_picture') if people | count >= slot else none }}
        state: >-
          {% set homes = (state_attr('sensor.people_home', 'people') or {}).values() | list %}
          {{ homes | count >= slot and homes[slot - 1] }}
  - variables:
      slot: 2
    binary_sensor:
      - <<: *slot
        name: Presence 2
        unique_id: presence_2
  - variables:
      slot: 3
    binary_sensor:
      - <<: *slot
        name: Presence 3
        unique_id: presence_3
  - variables:
      slot: 4
    binary_sensor:
      - <<: *slot
        name: Presence 4
        unique_id: presence_4
