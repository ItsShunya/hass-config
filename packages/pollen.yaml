# Pollen level at home, for the sidebar (cards/sidebar/bottom.yaml) and a
# WhatsApp message on high days.
#
# Counts come from Open-Meteo's air quality API: free, no key, Europe only.
# Outside the pollen season they're all 0. It gets sent the home location,
# like Met.no. https://open-meteo.com/en/docs/air-quality-api

rest:
  # Line breaks become spaces, but they all fall inside {{ }} or after -%},
  # so the URL ends up without any.
  - resource_template: >-
      {%- set types = 'alder_pollen,birch_pollen,olive_pollen,grass_pollen,mugwort_pollen,ragweed_pollen' -%}
      https://air-quality-api.open-meteo.com/v1/air-quality?current={{ types
      }}&hourly={{ types }}&forecast_days=1&timezone=auto&latitude={{ state_attr('zone.home', 'latitude')
      }}&longitude={{ state_attr('zone.home', 'longitude') }}
    # The API updates hourly.
    scan_interval: 3600
    sensor:
      # State is the worst level of any type right now: None, Low, Moderate,
      # High or Very high (custom_templates/pollen.jinja). Each type's count
      # (grains/m³) is an attribute.
      - name: Pollen
        unique_id: pollen_level
        icon: mdi:flower-pollen
        json_attributes_path: "$.current"
        json_attributes:
          - alder_pollen
          - birch_pollen
          - olive_pollen
          - grass_pollen
          - mugwort_pollen
          - ragweed_pollen
        value_template: >-
          {% from 'pollen.jinja' import pollen_level %}
          {{ pollen_level(value_json.current) }}

      # The worst hour forecast for today. Pollen peaks in the afternoon, so
      # the morning message uses this instead of the current level.
      - name: Pollen today
        unique_id: pollen_today
        icon: mdi:flower-pollen-outline
        value_template: >-
          {% from 'pollen.jinja' import pollen_level %}
          {{ pollen_level(value_json.hourly) }}

automation:
  - id: pollen_update_on_start
    alias: Pollen - update on start
    description: Fetch the pollen level again once Home Assistant has started.
    # The first request often runs before zone.home exists, so it fails and
    # the sensor would stay unknown until the next hourly update.
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.pollen

  - id: pollen_notify_high
    alias: Pollen - notify high days
    description: Send a WhatsApp message in the morning when pollen will be high today.
    triggers:
      - trigger: time
        at: "06:15:00"
    conditions:
      - condition: state
        entity_id: sensor.pollen_today
        state:
          - High
          - Very high
    actions:
      - action: notify.whatsapp
        data:
          target: !secret whatsapp_group
          message: "Pollen: {{ states('sensor.pollen_today') | lower }} today"
