# Pollen level at home, for the sidebar (cards/sidebar/bottom.yaml).
#
# Counts come from Open-Meteo's air quality API: free, no key, Europe only.
# Outside the pollen season they're all 0. It gets sent the home location,
# like Met.no. https://open-meteo.com/en/docs/air-quality-api

rest:
  # Line breaks become spaces, but they all fall inside {{ }} or after -%},
  # so the URL ends up without any.
  - resource_template: >-
      {%- set types = 'alder_pollen,birch_pollen,olive_pollen,grass_pollen,mugwort_pollen,ragweed_pollen' -%}
      https://air-quality-api.open-meteo.com/v1/air-quality?current={{ types
      }}&latitude={{ state_attr('zone.home', 'latitude')
      }}&longitude={{ state_attr('zone.home', 'longitude') }}
    # The API updates hourly.
    scan_interval: 3600
    sensor:
      # State is the worst level of any type: None, Low, Moderate, High or
      # Very high. Each type's count (grains/m³) is an attribute.
      #
      # Levels use the National Allergy Bureau (AAAAI) thresholds, which are
      # different for trees, grass and weeds. `scales` has the lowest count for
      # Low, Moderate, High and Very high; the level is how many are reached.
      - name: Pollen
        unique_id: pollen_level
        icon: mdi:flower-pollen
        json_attributes_path: "$.current"
        json_attributes:
          - alder_pollen
          - birch_pollen
          - olive_pollen
          - grass_pollen
          - mugwort_pollen
          - ragweed_pollen
        value_template: >-
          {% set levels = ['None', 'Low', 'Moderate', 'High', 'Very high'] %}
          {% set scales = {
            'tree': [1, 15, 90, 1500],
            'grass': [1, 5, 20, 200],
            'weed': [1, 10, 50, 500],
          } %}
          {% set types = {
            'alder_pollen': 'tree', 'birch_pollen': 'tree', 'olive_pollen': 'tree',
            'grass_pollen': 'grass',
            'mugwort_pollen': 'weed', 'ragweed_pollen': 'weed',
          } %}
          {% set ns = namespace(level=0) %}
          {% for key, group in types.items() %}
            {% set count = value_json.current[key] | float(0) %}
            {% set ns.level = [ns.level, scales[group] | select('le', count) | list | count] | max %}
          {% endfor %}
          {{ levels[ns.level] }}

automation:
  - id: pollen_update_on_start
    alias: Pollen - update on start
    description: Fetch the pollen level again once Home Assistant has started.
    # The first request often runs before zone.home exists, so it fails and
    # the sensor would stay unknown until the next hourly update.
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.pollen
