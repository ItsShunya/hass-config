# Small, semi-transparent weather card shown under the menu on every view:
# just the condition icon, the condition and the temperature. Tapping it opens
# the full forecast.
type: custom:weather-forecast-card
entity: weather.forecast_home
show_current: true
show_forecast: false
tap_action:
  action: more-info
current:
  show_attributes: false
  temperature_precision: 0
view_layout:
  grid-area: weather
# The card has no option to hide the entity name or the secondary value
# (humidity, or high/low), so they are hidden here.
card_mod:
  style: |
    ha-card {
      background: color-mix(in srgb, var(--ha-card-background, var(--card-background-color)) 50%, transparent);
      backdrop-filter: blur(8px);
    }
    ha-card .wfc-name,
    ha-card .wfc-current-secondary-info {
      display: none;
    }
