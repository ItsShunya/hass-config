# What's drawn on the floor plan in the Cleaning view (cards/vacuum_map.yaml):
# the rooms the vacuum can clean, the robot itself, its status and its
# buttons.

# Rooms. Tap one to pick it and again to drop it; Start cleans the picked
# ones in the order they were picked. The picks are kept in
# input_text.vacuum_rooms (packages/vacuum.yaml), so every screen shows the
# same ones.
#
# Each room is an icon element stretched over its floor, with the icon itself
# hidden: the card only reacts to taps on the icon, so it has to cover the
# room. `left`, `top`, `width` and `height` are the room's box in % of the
# image, and `clip-path` cuts L-shaped rooms out of it. `--room` is the name on
# its tag (in double quotes, it's used as CSS content). `room` in the
# tap_action is the robot's segment id; the robot's own name for it is in the
# comment above. The kitchen and the living room are one segment to the robot,
# so picking either lights up both.
#
# The card_mod below is the same for every room. It highlights the room when
# its id is in the picks and numbers its tag with its place in the order.
#
# 7: Living Room
- type: icon
  icon: mdi:floor-plan
  tap_action:
    action: perform-action
    perform_action: script.vacuum_toggle_room
    data:
      room: 7
  style:
    left: 43.05%
    top: 53.8%
    width: 32.59%
    height: 36.6%
    --room: '"Living room"'
  card_mod: &room
    style: |
      :host ha-icon,
      :host ha-icon:focus {
        position: absolute;
        inset: 0;
        background: none;
        --mdc-icon-size: 0px;
      }
      {%- set picked = states('input_text.vacuum_rooms').split(',') %}
      {%- set id = config.tap_action.data.room | string %}
      {%- if id in picked %}
      :host {
        --room-fill: color-mix(in srgb, var(--primary-color) 30%, transparent);
        --tag-line: transparent;
        --tag-bg: var(--primary-color);
        --tag-fg: var(--text-primary-color);
        --order: "{{ picked.index(id) + 1 }}";
      }
      {%- endif %}

# 7: Living Room, the kitchen end.
- type: icon
  icon: mdi:floor-plan
  tap_action:
    action: perform-action
    perform_action: script.vacuum_toggle_room
    data:
      room: 7
  style:
    left: 75.64%
    top: 53.59%
    width: 18.01%
    height: 42.93%
    clip-path: polygon(0 0, 52.4% 0, 52.4% 36.1%, 100% 36.1%, 100% 100%, 0 100%)
    --room: '"Kitchen"'
  card_mod: *room

