# The robot, where it is right now. Its position comes from
# custom_templates/vacuum.jinja and updates every 10 seconds, the map
# integration's polling interval; it glides there over those 10 seconds, so it
# moves smoothly a step behind the real robot. It pulses while cleaning, and
# lets taps through to the room under it.
- type: state-icon
  entity: vacuum.robot_vacuum
  icon: mdi:robot-vacuum
  state_color: false
  tap_action:
    action: none
  hold_action:
    action: none
  card_mod:
    style: |
      {%- from 'vacuum.jinja' import vacuum_plan_position %}
      {%- set pos = vacuum_plan_position() %}
      :host {
        font-size: max(12px, 1.8cqw);
        pointer-events: none;
        transition: left 10s linear, top 10s linear;
      {%- if pos %}
      {%- set pos = pos | from_json %}
        left: {{ pos.left }}%;
        top: {{ pos.top }}%;
      {%- else %}
        display: none;
      {%- endif %}
      }
      state-badge {
        width: 2em;
        height: 2em;
        border-radius: 50%;
        background: var(--primary-color);
        color: var(--text-primary-color);
        --state-icon-color: var(--text-primary-color);
        --mdc-icon-size: 1.25em;
        box-shadow: 0 0.1em 0.4em rgba(0, 0, 0, 0.5);
      }
      {%- if is_state('vacuum.robot_vacuum', 'cleaning') %}
      state-badge {
        animation: pulse 2s ease-out infinite;
      }
      @keyframes pulse {
        from {
          box-shadow:
            0 0.1em 0.4em rgba(0, 0, 0, 0.5),
            0 0 0 0 color-mix(in srgb, var(--primary-color) 60%, transparent);
        }
        to {
          box-shadow:
            0 0.1em 0.4em rgba(0, 0, 0, 0.5),
            0 0 0 0.8em transparent;
        }
      }
      {%- endif %}

# Status, in an empty corner like the Home view's alarm tag.
- type: conditional
  conditions: []
  style:
    left: 84%
    top: 14%
    --room: '"Robot"'
  elements:
    - type: icon
      icon: mdi:robot-vacuum
      entity: vacuum.robot_vacuum
    - type: state-label
      entity: vacuum.robot_vacuum
    - type: icon
      icon: mdi:battery
      entity: sensor.robot_vacuum_battery
    - type: state-label
      entity: sensor.robot_vacuum_battery

# Buttons, in the empty bottom left corner: Start on top, then pause, stop
# and dock. Start cleans the picked rooms, or the whole house if none are
# picked, and its label says which. The other buttons are outlined while the
# robot is in their state.
#
# Like the rooms, each button is the icon itself, styled by the card_mod
# below, since that's the part that takes taps.
- type: conditional
  conditions: []
  style:
    left: 15%
    top: 84%
    display: grid
    grid-template-columns: repeat(3, auto)
    gap: 0.5em
    padding: 0
    border: none
    background: none
    font-size: max(14px, 2cqw)
    pointer-events: auto
  elements:
    - type: icon
      icon: mdi:play
      title: Start
      tap_action:
        action: perform-action
        perform_action: script.vacuum_start
      style:
        grid-column: 1 / -1
        justify-self: center
      card_mod: &button
        style: |
          :host ha-icon,
          :host ha-icon:focus {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4em;
            box-sizing: border-box;
            min-width: 2.6em;
            height: 2.6em;
            padding: 0;
            border: 1px solid color-mix(in srgb, var(--primary-text-color) 15%, transparent);
            border-radius: 1.3em;
            background: color-mix(in srgb, var(--card-background-color) 80%, transparent);
            color: var(--primary-text-color);
            --mdc-icon-size: 1.2em;
          }
          {%- set state = states('vacuum.robot_vacuum') %}
          {%- set action = config.tap_action.perform_action %}
          {%- if action == 'script.vacuum_start' %}
          {%- set n = states('input_text.vacuum_rooms').split(',')
            | reject('in', ['', 'unknown', 'unavailable']) | list | count %}
          {%- set label = 'Clean ' ~ n ~ (' room' if n == 1 else ' rooms') if n
            else 'Resume' if state == 'paused'
            else 'Cleaning' if state == 'cleaning'
            else 'Clean all' %}
          :host ha-icon,
          :host ha-icon:focus {
            padding: 0 1em 0 0.8em;
            border-color: transparent;
            background: var(--primary-color);
            color: var(--text-primary-color);
          }
          :host ha-icon::after {
            content: "{{ label }}";
            font-size: 0.8em;
            font-weight: 500;
          }
          {%- elif state in {
            'vacuum.pause': ['paused'],
            'script.vacuum_stop': ['idle'],
            'vacuum.return_to_base': ['returning', 'docked'],
          }.get(action, []) %}
          :host ha-icon,
          :host ha-icon:focus {
            border-color: var(--primary-color);
            color: var(--primary-color);
          }
          {%- endif %}
    # The robot has no pause action of its own. xiaomi_miot falls back to
    # "stop-sweeping", which pauses on Dreame robots.
    - type: icon
      icon: mdi:pause
      title: Pause
      tap_action:
        action: perform-action
        perform_action: vacuum.pause
        target:
          entity_id: vacuum.robot_vacuum
      card_mod: *button
    - type: icon
      icon: mdi:stop
      title: Stop
      tap_action:
        action: perform-action
        perform_action: script.vacuum_stop
      card_mod: *button
    - type: icon
      icon: mdi:home-map-marker
      title: Dock
      tap_action:
        action: perform-action
        perform_action: vacuum.return_to_base
        target:
          entity_id: vacuum.robot_vacuum
      card_mod: *button
