# Rooms, robot and buttons on the Cleaning view (cards/vacuum_map.yaml).

# Rooms. Tap to pick or unpick, and Start cleans the picked ones in order. The
# picks live in input_text.vacuum_rooms so all screens see the same.
#
# Each room is an icon stretched over the floor with the icon hidden, since
# only the icon takes taps. left/top/width/height are its box in %, and
# clip-path cuts out the L-shaped ones. `room` is the robot's segment id.
# Kitchen and living room are the same segment for the robot.
#
# 7: Living Room
- type: icon
  icon: mdi:floor-plan
  tap_action:
    action: perform-action
    perform_action: script.vacuum_toggle_room
    data:
      room: 7
  style:
    left: 43.05%
    top: 53.8%
    width: 32.59%
    height: 36.6%
    --room: '"Living room"'
  # Highlights the room and numbers it when it's picked.
  card_mod: &room
    style: |
      :host ha-icon,
      :host ha-icon:focus {
        position: absolute;
        inset: 0;
        background: none;
        --mdc-icon-size: 0px;
      }
      {%- set picked = states('input_text.vacuum_rooms').split(',') %}
      {%- set id = config.tap_action.data.room | string %}
      {%- if id in picked %}
      :host {
        --room-fill: color-mix(in srgb, var(--primary-color) 30%, transparent);
        --tag-line: transparent;
        --tag-bg: var(--primary-color);
        --tag-fg: var(--text-primary-color);
        --order: "{{ picked.index(id) + 1 }}";
      }
      {%- endif %}

