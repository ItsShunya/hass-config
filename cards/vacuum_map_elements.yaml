# The robot. The map integration updates its position every 10s, so it slides
# there over 10s. Hidden until custom_templates/vacuum.jinja knows where it is,
# pulses while cleaning.
- type: state-icon
  entity: vacuum.robot_vacuum
  icon: mdi:robot-vacuum
  state_color: false
  tap_action:
    action: none
  hold_action:
    action: none
  card_mod:
    style: |
      {%- from 'vacuum.jinja' import vacuum_plan_position %}
      {%- set pos = vacuum_plan_position() %}
      :host {
        font-size: max(12px, 1.8cqw);
        pointer-events: none;
        transition: left 10s linear, top 10s linear;
      {%- if pos %}
      {%- set pos = pos | from_json %}
        left: {{ pos.left }}%;
        top: {{ pos.top }}%;
      {%- else %}
        display: none;
      {%- endif %}
      }
      state-badge {
        width: 2em;
        height: 2em;
        border-radius: 50%;
        background: var(--primary-color);
        --state-icon-color: var(--text-primary-color);
        --mdc-icon-size: 1.25em;
        box-shadow: 0 0.1em 0.4em rgba(0, 0, 0, 0.5);
      }
      {%- if is_state('vacuum.robot_vacuum', 'cleaning') %}
      state-badge {
        animation: pulse 2s ease-out infinite;
      }
      @keyframes pulse {
        from {
          box-shadow:
            0 0.1em 0.4em rgba(0, 0, 0, 0.5),
            0 0 0 0 color-mix(in srgb, var(--primary-color) 60%, transparent);
        }
        to {
          box-shadow:
            0 0.1em 0.4em rgba(0, 0, 0, 0.5),
            0 0 0 0.8em transparent;
        }
      }
      {%- endif %}

- type: conditional
  conditions: []
  style:
    left: 84%
    top: 14%
    --room: '"Robot"'
  elements:
    - type: icon
      icon: mdi:robot-vacuum
      entity: vacuum.robot_vacuum
    - type: state-label
      entity: vacuum.robot_vacuum
    - type: icon
      icon: mdi:battery
      entity: sensor.robot_vacuum_battery
    - type: state-label
      entity: sensor.robot_vacuum_battery

# Buttons: Start (Resume when paused, Stop while cleaning) and Dock. No
# pause, it does the same as stop on this robot. Start and Stop are separate
# buttons and only one is shown at a time.
- type: conditional
  conditions: []
  style:
    left: 15%
    top: 84%
    display: flex
    gap: 0.5em
    padding: 0
    border: none
    background: none
    font-size: max(14px, 2cqw)
    pointer-events: auto
  elements:
    - type: icon
      icon: mdi:play
      title: Start
      tap_action:
        action: perform-action
        perform_action: script.vacuum_start
      card_mod: &button
        style: |
          {%- set action = config.tap_action.perform_action %}
          {%- set cleaning = is_state('vacuum.robot_vacuum', 'cleaning') %}
          :host ha-icon,
          :host ha-icon:focus {
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
            box-sizing: border-box;
            min-width: 2.6em;
            height: 2.6em;
            justify-content: center;
            border: 1px solid color-mix(in srgb, var(--primary-text-color) 15%, transparent);
            border-radius: 1.3em;
            background: color-mix(in srgb, var(--card-background-color) 80%, transparent);
            color: var(--primary-text-color);
            --mdc-icon-size: 1.2em;
          }
          {%- if action == 'vacuum.return_to_base' %}
          {%- if states('vacuum.robot_vacuum') in ['returning', 'docked'] %}
          :host ha-icon {
            border-color: var(--primary-color);
            color: var(--primary-color);
          }
          {%- endif %}
          {%- else %}
          {%- set n = states('input_text.vacuum_rooms').split(',')
            | reject('in', ['', 'unknown', 'unavailable']) | list | count %}
          :host ha-icon,
          :host ha-icon:focus {
            padding: 0 1em 0 0.8em;
            border-color: transparent;
            background: var(--primary-color);
            color: var(--text-primary-color);
          }
          :host ha-icon::after {
            font-size: 0.8em;
            font-weight: 500;
          {%- if action == 'script.vacuum_stop' %}
            content: "Stop";
          {%- elif n %}
            content: "Clean {{ n }} room{{ 's' if n > 1 }}";
          {%- elif is_state('vacuum.robot_vacuum', 'paused') %}
            content: "Resume";
          {%- else %}
            content: "Clean all";
          {%- endif %}
          }
          {%- if cleaning != (action == 'script.vacuum_stop') %}
          /* !important or the card's own CSS wins */
          :host {
            display: none !important;
          }
          {%- endif %}
          {%- endif %}
    - type: icon
      icon: mdi:stop
      title: Stop
      tap_action:
        action: perform-action
        perform_action: script.vacuum_stop
      card_mod: *button
    - type: icon
      icon: mdi:home-map-marker
      title: Dock
      tap_action:
        action: perform-action
        perform_action: vacuum.return_to_base
        target:
          entity_id: vacuum.robot_vacuum
      card_mod: *button
