# Floor plan with a tag on each room. The tags are in floorplan_elements.yaml,
# this file only styles them.
type: picture-elements
elements: !include floorplan_elements.yaml
image: /local/images/floor_plan.png
view_layout:
  grid-area: main
# The plan fits its grid area with no card around it. #root keeps the image's
# aspect ratio so the tags stay on their rooms: --plan-ratio is its width /
# height (1166 / 948), update it with a new image. The image is cropped to the
# shape of this area on the tablet, so there it fills it. On phones it takes
# the full width.
#
# Tags are sized in cqw (1% of the plan's width) so they scale with it. They
# stop shrinking at 10px to stay readable on phones.
card_mod:
  style: |
    :host {
      --plan-ratio: 1.23;
      height: 100%;
    }
    ha-card {
      height: 100%;
      container-type: size;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      box-shadow: none;
    }
    #root {
      width: min(100cqw, calc(var(--plan-ratio) * 100cqh));
      border-radius: var(--ha-card-border-radius, 12px);
      overflow: hidden;
      container-type: inline-size;
    }
    #root > hui-conditional-element {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 0.35em 0.6em 0.4em;
      border: 1px solid color-mix(in srgb, var(--primary-text-color) 15%, transparent);
      border-radius: 0.6em;
      background: color-mix(in srgb, var(--card-background-color) 80%, transparent);
      font-size: max(10px, 1.4cqw);
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
      --mdc-icon-size: 1.1em;
    }
    #root > hui-conditional-element::before {
      content: var(--room);
      display: block;
      font-size: 0.7em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--secondary-text-color);
    }
    /* The card positions every element absolutely. Inside a tag, put them
       in a row after the name instead. */
    #root > hui-conditional-element > .element {
      position: static;
      transform: none;
      display: inline-flex;
      vertical-align: middle;
    }
    #root > hui-conditional-element > hui-icon-element {
      margin-right: 0.2em;
      color: var(--secondary-text-color);
    }
    /* state-label pads its text by 8px inside its shadow root, which we
       can't style, so cancel it with a negative margin. */
    #root > hui-conditional-element > hui-state-label-element {
      margin: -8px;
    }
    #root > hui-conditional-element > hui-state-label-element:not(:last-child) {
      margin-right: calc(0.6em - 8px);
    }
    @media (max-width: 800px) {
      ha-card {
        height: auto;
        container-type: normal;
      }
      #root {
        width: 100%;
      }
    }
