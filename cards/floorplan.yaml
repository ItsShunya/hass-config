# Floor plan with a tag on each room. The tags are in floorplan_elements.yaml;
# this file only sets how they look. With a new image, update --plan-ratio.
type: picture-elements
elements: !include floorplan_elements.yaml
image: /local/images/floor_plan.png
view_layout:
  grid-area: main
# Fit the plan inside its grid area, with no card around it, against the menu
# on its left. #root keeps the image's shape, so the tags stay on their rooms:
# --plan-ratio is the image's width / height (1166 / 948). The image is
# cropped around the house to the shape of this area on the tablet (see
# docs/dashboard-sizes.md), so there it fills the area. On phones the plan
# just takes the full width.
#
# The tags are sized in cqw, hundredths of the plan's width, so they shrink
# and grow with it and keep fitting their rooms. Below 10px they stop
# shrinking, to stay readable on phones, where they outgrow their rooms.
card_mod:
  style: |
    :host {
      --plan-ratio: 1.23;
      height: 100%;
    }
    ha-card {
      height: 100%;
      container-type: size;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      box-shadow: none;
    }
    #root {
      width: min(100cqw, calc(var(--plan-ratio) * 100cqh));
      border-radius: var(--ha-card-border-radius, 12px);
      overflow: hidden;
      container-type: inline-size;
    }
    #root > hui-conditional-element {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 0.35em 0.6em 0.4em;
      border: 1px solid color-mix(in srgb, var(--primary-text-color) 15%, transparent);
      border-radius: 0.6em;
      background: color-mix(in srgb, var(--card-background-color) 80%, transparent);
      font-size: max(10px, 1.4cqw);
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
      --mdc-icon-size: 1.1em;
    }
    #root > hui-conditional-element::before {
      content: var(--room);
      display: block;
      font-size: 0.7em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--secondary-text-color);
    }
    /* The card positions every element on its own; inside a tag they line
       up after the name, centred on each other. */
    #root > hui-conditional-element > .element {
      position: static;
      transform: none;
      display: inline-flex;
      vertical-align: middle;
    }
    #root > hui-conditional-element > hui-icon-element {
      margin-right: 0.2em;
      color: var(--secondary-text-color);
    }
    /* state-label pads its text by 8px inside its own shadow root, out of
       reach of these styles: a matching negative margin cancels it. */
    #root > hui-conditional-element > hui-state-label-element {
      margin: -8px;
    }
    #root > hui-conditional-element > hui-state-label-element:not(:last-child) {
      margin-right: calc(0.6em - 8px);
    }
    @media (max-width: 800px) {
      ha-card {
        height: auto;
        container-type: normal;
      }
      #root {
        width: 100%;
      }
    }
