# Bottom of the sidebar: who's home, pollen, the weather and the inside
# temperature. Sizes scale with the screen through --dash-px and
# --dash-space-px (docs/dashboard.md).
type: vertical-stack
view_layout:
  grid-area: bottom
card_mod:
  style: |
    :host {
      --vertical-stack-card-gap: calc(8 * var(--dash-space-px));
    }
cards:
  # People's pictures, faded when they're away. The slots come from
  # packages/presence.yaml and empty ones are hidden. Taps do nothing.
  - type: glance
    show_name: false
    show_state: false
    entities:
      - binary_sensor.presence_1
      - binary_sensor.presence_2
      - binary_sensor.presence_3
      - binary_sensor.presence_4
    # Selectors are more specific than the card's own rules, which load later.
    # Each picture is inside the entity's shadow root, reached with "$".
    card_mod:
      style:
        .: |
          ha-card {
            background: none;
            border: none;
            box-shadow: none;
          }
          ha-card .entities.no-header {
            justify-content: flex-start;
            gap: calc(16 * var(--dash-space-px));
            padding: calc(16 * var(--dash-space-px)) calc(20 * var(--dash-space-px)) 0;
          }
          .entities .entity {
            width: auto;
            margin: 0;
            padding: 0;
            pointer-events: none;
          }
          {% for e in config.entities %}
          {% set entity = e.entity if e is mapping else e %}
          {% if is_state(entity, 'unavailable') %}
          .entities .entity:nth-child({{ loop.index }}) {
            display: none;
          }
          {% elif not is_state(entity, 'on') %}
          .entities .entity:nth-child({{ loop.index }}) {
            filter: grayscale(1);
            opacity: 0.4;
          }
          {% endif %}
          {% endfor %}
        .entity$: |
          state-badge {
            width: calc(64 * var(--dash-px));
            height: calc(64 * var(--dash-px));
            margin: 0;
            --mdc-icon-size: calc(36 * var(--dash-px));
            border: calc(2 * var(--dash-px)) solid var(--primary-text-color);
            border-radius: 50%;
          }

  # Pollen, weather and inside temperature: values on the left, icons on the
  # right. The pollen icon sits in a ring that fills up and changes color with
  # the level.
  - type: markdown
    content: |
      {%- set weather = 'weather.forecast_home' -%}
      {%- set inside = 'sensor.kitchen_temperature' -%}
      {%- set icons = {
        'clear-night': 'night', 'cloudy': 'cloudy', 'fog': 'fog', 'hail': 'hail',
        'lightning': 'lightning', 'lightning-rainy': 'lightning-rainy',
        'partlycloudy': 'partly-cloudy', 'pouring': 'pouring', 'rainy': 'rainy',
        'snowy': 'snowy', 'snowy-rainy': 'snowy-rainy', 'sunny': 'sunny',
        'windy': 'windy', 'windy-variant': 'windy-variant' } -%}
      {%- set weather_icon = 'mdi:weather-' ~ icons.get(states(weather), 'cloudy') -%}
      <table>
      <tr>
      <td>Pollen<br><span>{{ state_translated('sensor.pollen') }}</span></td>
      <td><ha-icon icon="mdi:flower-pollen-outline"></ha-icon></td>
      </tr>
      <tr>
      <td>{{ state_attr(weather, 'temperature') }} {{ state_attr(weather, 'temperature_unit') }}<br>
      <span>{{ state_translated(weather) }}</span></td>
      <td><ha-icon icon="{{ weather_icon }}"></ha-icon></td>
      </tr>
      <tr>
      <td>{{ states(inside) }} {{ state_attr(inside, 'unit_of_measurement') }}</td>
      <td><ha-icon icon="mdi:home-thermometer-outline"></ha-icon></td>
      </tr>
      </table>
    card_mod:
      style:
        # Padding goes on ha-card only.
        .: |
          ha-card {
            background: none;
            border: none;
            box-shadow: none;
            padding:
              calc(16 * var(--dash-space-px))
              calc(32 * var(--dash-space-px))
              calc(24 * var(--dash-space-px));
          }
          ha-card ha-markdown {
            padding: 0;
          }
        ha-markdown$: |
          {% set level = states('sensor.pollen') %}
          {% set fill = {'None': 0, 'Low': 25, 'Moderate': 50, 'High': 75, 'Very high': 100}.get(level, 0) %}
          {% set colors = {'Low': 'var(--success-color)', 'Moderate': 'var(--warning-color)'} %}
          {% set color = colors.get(level, 'var(--error-color)') %}
          table {
            width: 100%;
            border-spacing: 0 calc(10 * var(--dash-space-px));
            --markdown-table-border-collapse: separate;
            --markdown-table-border-width: 0;
            --markdown-table-padding-inline: 0;
            --markdown-table-padding-block: 0;
          }
          td {
            vertical-align: middle;
            font-size: calc(18 * var(--dash-px));
            font-weight: 300;
            line-height: 1.3;
          }
          td span {
            font-size: calc(15 * var(--dash-px));
            opacity: 0.6;
          }
          td:last-child {
            width: calc(44 * var(--dash-px));
            text-align: center;
          }
          ha-icon {
            --mdc-icon-size: calc(28 * var(--dash-px));
            opacity: 0.8;
          }
          tr:first-child ha-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: calc(40 * var(--dash-px));
            height: calc(40 * var(--dash-px));
            border-radius: 50%;
            --mdc-icon-size: calc(20 * var(--dash-px));
            opacity: 1;
            background:
              radial-gradient(closest-side,
                var(--card-background-color) calc(100% - 3 * var(--dash-px)),
                transparent calc(100% - 2 * var(--dash-px))),
              conic-gradient({{ color }} {{ fill }}%, color-mix(in srgb, var(--primary-text-color) 15%, transparent) 0);
          }
