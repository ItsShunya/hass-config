# Sidebar background: an empty card filling the left column out to the screen
# edges. It has to come before the other sidebar cards in each view so it's
# drawn behind them. Hidden on phones.
type: markdown
content: " "
view_layout:
  grid-area: sidebar
card_mod:
  style: |
    :host {
      display: block;
      height: 100%;
    }
    /* ":host >" outranks the markdown card's own height rule. */
    :host > ha-card {
      /* Cover the card's own margins (4px, 8px at the bottom), except the
         right one: main starts there. */
      margin: -4px 0 -8px -4px;
      height: calc(100% + 12px);
      border: none;
      border-radius: 0;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.25);
    }
    @media (max-width: 800px) {
      ha-card {
        display: none;
      }
    }
