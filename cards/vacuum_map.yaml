            - 650
          - - -7000
            - 2000
          - - -5700
            - 2000
          - - -5700
            - 650
      - id: 3
        outline:
          - - -8550
            - 5000
          - - -8550
            - 6050
          - - -6950
            - 6050
          - - -6950
            - 5000
      - id: 4
        outline:
          - - -500
            - -1050
