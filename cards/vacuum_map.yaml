# Extra customizable tiles at the bottom for sensors/buttons.
tiles:
  - icon: mdi:brush
    label: Main brush time remaining (h)
    entity: sensor.dreame_r2205_ad79_brush_left_time
  - icon: mdi:brush-variant
    label: Side brush time remaining (h)
    entity: sensor.dreame_r2205_ad79_brush_left_time_2
  - icon: mdi:air-filter
    label: Filter time left (h)
    entity: sensor.dreame_r2205_ad79_filter_left_time
  - icon: mdi:battery-50
    label: Battery (%)
    entity: sensor.dreame_r2205_ad79_battery_level
  - icon: mdi:robot-vacuum
    label: Charging state
    entity: sensor.dreame_r2205_ad79_charging_state

# Custom CSS styling for this card.
card_mod:
  style: |
    ha-card {
      /* --map-card-primary-color: blue; */
      /* --map-card-zoomer-background: rgba(155, 130, 131, 0.7); */
      display: flex !important;
      align-items: stretch;
      flex-wrap: wrap;
      justify-content: space-evenly;
    }
    .map-wrapper {
      flex-grow: 3;
      width: 500px;
    }
    .controls-wrapper {
      flex-grow: 1;
      width: 300px;
    }
