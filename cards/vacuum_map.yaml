type: custom:xiaomi-vacuum-map-card
title: ''
vacuum_platform: al-one/hass-xiaomi-miot
# Anchor (&vacuum) reused below as *vacuum, so the entity is set only here.
entity: &vacuum vacuum.dreame_r2205_ad79_robot_cleaner
view_layout:
  grid-area: main

# Map's camera source comes from Xiaomi Cloud Map Extractor.
map_source:
  camera: camera.dreamebot_d10_plus_live_map
  crop: # Zoomout
    top: -100
    bottom: -100
    left: -100
    right: -100
two_finger_pan: true
map_locked: true
calibration_source:
  camera: true

# List of icons in the main bar (e.g. Play, Stop, etc).
icons:
  # Start clean routine, or resume it when paused.
  - icon: mdi:play
    tooltip: Start / Resume
    tap_action:
      action: call-service
      service: vacuum.start
      service_data:
        entity_id: *vacuum
    conditions:
      - entity: *vacuum
        value_not: cleaning
      - entity: *vacuum
        value_not: returning
  # Pause current routine. The r2205 has no pause action: xiaomi_miot maps
  # vacuum.stop to "stop-sweeping", which pauses the task on Dreame robots.
  - icon: mdi:pause
    tooltip: Pause
    tap_action:
      action: call-service
      service: vacuum.stop
      service_data:
        entity_id: *vacuum
    conditions:
      - entity: *vacuum
        value_not: docked
      - entity: *vacuum
        value_not: idle
      - entity: *vacuum
        value_not: error
      - entity: *vacuum
        value_not: paused
  # Return to the dock to charge.
  - icon: mdi:home-map-marker
    tooltip: Return to base
    tap_action:
      action: call-service
      service: vacuum.return_to_base
      service_data:
        entity_id: *vacuum
    conditions:
      - entity: *vacuum
        value_not: docked
      - entity: *vacuum
        value_not: returning
  # Locate the vacuum (by sound).
  - icon: mdi:map-marker
    tooltip: Locate
    tap_action:
      action: call-service
      service: vacuum.locate
      service_data:
        entity_id: *vacuum

# Configurable actions in the map. Both call scripts from packages/vacuum.yaml,
# which hold the vacuum-specific MIoT call. '[[selection]]' is passed as-is:
# a list of rectangles for zones, a list of room ids for rooms.
map_modes:
  - template: vacuum_clean_zone
    name: Zone cleanup
    icon: mdi:select-drag
    max_selections: 1
    repeats_type: EXTERNAL
    max_repeats: 3
    service_call_schema:
      service: script.vacuum_clean_zone
      service_data:
        zone: '[[selection]]'
        repeats: '[[repeats]]'
  - template: vacuum_clean_segment
    name: Rooms
    icon: mdi:floor-plan
    max_selections: 1
    repeats_type: EXTERNAL
    max_repeats: 3
    service_call_schema:
      service: script.vacuum_clean_rooms
      service_data:
        rooms: '[[selection]]'
        repeats: '[[repeats]]'
    predefined_selections:
      - id: 1
        outline:
          - - -7050
            - 5200
          - - -7050
            - 6150
          - - -6750
            - 6150
          - - -6750
            - 5200
      - id: 2
