type: custom:xiaomi-vacuum-map-card
title: ''
vacuum_platform: al-one/hass-xiaomi-miot
# Reused below as *vacuum.
entity: &vacuum vacuum.robot_vacuum
view_layout:
  grid-area: main

# From Xiaomi Cloud Map Extractor.
map_source:
  camera: camera.robot_vacuum_map
  crop: # zoom out
    top: -100
    bottom: -100
    left: -100
    right: -100
two_finger_pan: true
map_locked: true
calibration_source:
  camera: true

icons:
  - icon: mdi:play
    tooltip: Start / Resume
    tap_action:
      action: call-service
      service: vacuum.start
      service_data:
        entity_id: *vacuum
    conditions:
      - entity: *vacuum
        value_not: cleaning
      - entity: *vacuum
        value_not: returning
  # The r2205 has no pause action, but xiaomi_miot maps vacuum.stop to
  # "stop-sweeping", which pauses on Dreame robots.
  - icon: mdi:pause
    tooltip: Pause
    tap_action:
      action: call-service
      service: vacuum.stop
      service_data:
        entity_id: *vacuum
    conditions:
      - entity: *vacuum
        value_not: docked
      - entity: *vacuum
        value_not: idle
      - entity: *vacuum
        value_not: error
      - entity: *vacuum
        value_not: paused
  - icon: mdi:home-map-marker
    tooltip: Return to base
    tap_action:
      action: call-service
      service: vacuum.return_to_base
      service_data:
        entity_id: *vacuum
    conditions:
      - entity: *vacuum
        value_not: docked
      - entity: *vacuum
        value_not: returning
  - icon: mdi:map-marker
    tooltip: Locate
    tap_action:
      action: call-service
      service: vacuum.locate
      service_data:
        entity_id: *vacuum

# Both modes call the scripts in packages/vacuum.yaml. '[[selection]]' is
# passed as is: a list of rectangles for zones, a list of room ids for rooms.
map_modes:
  - template: vacuum_clean_zone
    name: Zone cleanup
    icon: mdi:select-drag
    max_selections: 1
    repeats_type: EXTERNAL
    max_repeats: 3
    service_call_schema:
      service: script.vacuum_clean_zone
      service_data:
        zone: '[[selection]]'
        repeats: '[[repeats]]'
  - template: vacuum_clean_segment
    name: Rooms
    icon: mdi:floor-plan
    max_selections: 1
    repeats_type: EXTERNAL
    max_repeats: 3
    service_call_schema:
      service: script.vacuum_clean_rooms
      service_data:
        rooms: '[[selection]]'
        repeats: '[[repeats]]'
    predefined_selections:
      - id: 1
        outline:
          - - -7050
            - 5200
          - - -7050
            - 6150
          - - -6750
            - 6150
          - - -6750
            - 5200
      - id: 2
        outline:
          - - -7000
            - 650
          - - -7000
            - 2000
          - - -5700
            - 2000
          - - -5700
            - 650
      - id: 3
        outline:
          - - -8550
            - 5000
          - - -8550
            - 6050
          - - -6950
            - 6050
          - - -6950
            - 5000
      - id: 4
        outline:
          - - -500
            - -1050
          - - -500
            - 450
          - - 2450
            - 450
          - - 2450
            - -1050
      - id: 6
        outline:
          - - -8300
            - -850
          - - -8300
            - 700
          - - -5650
            - 700
          - - -5650
            - -850
      - id: 7
        outline:
          - - -5700
