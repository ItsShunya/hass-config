# Cleaning view: the Home floor plan, but tapping a room picks it for the
# vacuum. Everything on it is in vacuum_map_elements.yaml.
type: picture-elements
elements: !include vacuum_map_elements.yaml
image: /local/images/floor_plan.png
view_layout:
  grid-area: main
# Sized the same as cards/floorplan.yaml, keep both in sync.
card_mod:
  style: |
    :host {
      --plan-ratio: 1.23;
      height: 100%;
    }
    ha-card {
      height: 100%;
      container-type: size;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      box-shadow: none;
    }
    #root {
      width: min(100cqw, calc(var(--plan-ratio) * 100cqh));
      border-radius: var(--ha-card-border-radius, 12px);
      overflow: hidden;
      container-type: inline-size;
    }

    /* Rooms. Placed by their top left corner instead of their centre, with
       the order number and name in the middle. Each room's card_mod sets the
       variables while it's picked. */
    #root > hui-icon-element {
      transform: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3em;
      font-size: max(10px, 1.4cqw);
      background: var(--room-fill, transparent);
      transition: background-color 0.2s;
    }
    #root > hui-icon-element::before {
      content: var(--order);
      display: grid;
      place-items: center;
      width: 1.6em;
      height: 1.6em;
      border-radius: 50%;
      background: var(--primary-color);
      color: var(--text-primary-color);
      font-size: 0.8em;
      font-weight: 600;
    }
    #root > hui-icon-element::after {
      content: var(--room);
      padding: 0.35em 0.6em 0.4em;
      border: 1px solid var(--tag-line, color-mix(in srgb, var(--primary-text-color) 15%, transparent));
      border-radius: 0.6em;
      background: var(--tag-bg, color-mix(in srgb, var(--card-background-color) 80%, transparent));
      color: var(--tag-fg, var(--secondary-text-color));
      font-size: 0.8em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Status tag, same as on the Home view. */
    #root > hui-conditional-element {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 0.35em 0.6em 0.4em;
      border: 1px solid color-mix(in srgb, var(--primary-text-color) 15%, transparent);
      border-radius: 0.6em;
      background: color-mix(in srgb, var(--card-background-color) 80%, transparent);
      font-size: max(10px, 1.4cqw);
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
      --mdc-icon-size: 1.1em;
    }
    #root > hui-conditional-element::before {
      content: var(--room);
      display: block;
      font-size: 0.7em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--secondary-text-color);
    }
    #root > hui-conditional-element > .element {
      position: static;
      transform: none;
      display: inline-flex;
      vertical-align: middle;
    }
    #root > hui-conditional-element > hui-icon-element {
      color: var(--secondary-text-color);
    }
    /* Cancels the 8px padding state-label has inside. */
    #root > hui-conditional-element > hui-state-label-element {
      margin: -8px -8px -8px calc(0.2em - 8px);
    }
    #root > hui-conditional-element > hui-state-label-element:not(:last-child) {
      margin-right: calc(0.6em - 8px);
    }
    @media (max-width: 800px) {
      ha-card {
        height: auto;
        container-type: normal;
      }
      #root {
        width: 100%;
      }
    }
