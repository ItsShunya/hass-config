tiles:
  - icon: mdi:brush
    label: Main brush time remaining (h)
    entity: sensor.robot_vacuum_main_brush_left
  - icon: mdi:brush-variant
    label: Side brush time remaining (h)
    entity: sensor.robot_vacuum_side_brush_left
  - icon: mdi:air-filter
    label: Filter time left (h)
    entity: sensor.robot_vacuum_filter_left
  - icon: mdi:battery-50
    label: Battery (%)
    entity: sensor.robot_vacuum_battery
  - icon: mdi:robot-vacuum
    label: Charging state
    entity: sensor.robot_vacuum_charging_state

# Map and controls side by side when there's room, stacked otherwise. Their
# widths scale with --dash-px, so they stay side by side on a smaller tablet.
card_mod:
  style: |
    ha-card {
      display: flex !important;
      align-items: stretch;
      flex-wrap: wrap;
      justify-content: space-evenly;
    }
    .map-wrapper {
      flex-grow: 3;
      width: calc(500 * var(--dash-px));
    }
    .controls-wrapper {
      flex-grow: 1;
      width: calc(300 * var(--dash-px));
    }
