# Every secret the config uses, with placeholder values. The real secrets.yaml
# is only on the server (edit it with `make secrets`). CI uses this file instead.

# Home Wi-Fi names, as a list even if there's only one (packages/presence.yaml).
home_wifi:
  - Home Wi-Fi

# Your WhatsApp number, quoted, with the country code and no "+"
# (packages/notifications.yaml). Not the bridge's own number.
whatsapp_number: "34600000000"
