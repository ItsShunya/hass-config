# The secrets the configuration uses, with placeholder values. The real
# secrets.yaml lives only on the server (it's ignored by git); see README.md.
# CI checks the configuration with this file in its place.

# Names (SSIDs) of the home Wi-Fi networks, as a list, also when there's only
# one: a phone connected to any of them counts as home (packages/presence.yaml).
home_wifi:
  - Home Wi-Fi
