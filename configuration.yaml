# One file per feature in packages/. Nothing else is set here, so location,
# units and so on stay editable in the UI.
homeassistant:
  packages: !include_dir_named packages

# default_config, with the ones I don't need commented out. default_config
# can't exclude anything, so they have to be listed by hand.
#assist_pipeline:
backup:
#bluetooth:
config:
#conversation:
dhcp:
#energy:
#go2rtc:
#history:
homeassistant_alerts:
#cloud:
image_upload:
#logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
#usage_prediction:
usb:
webhooks:
#zeroconf:

frontend:
  themes: !include_dir_merge_named themes
  # kiosk-mode goes here instead of in lovelace resources so it runs before
  # the dashboard draws, otherwise the header flashes. Update it together with
  # Home Assistant (docs/vendored.md).
  extra_module_url:
    # renovate: repo=NemesisRE/kiosk-mode
    - /local/plugins/kiosk-mode/kiosk-mode.js?v=10.0.1

lovelace:
  resource_mode: yaml
  # Bump ?v= whenever a file changes, or browsers keep the cached copy. The
  # renovate comments tell Renovate where to look for new releases.
  resources:
    # renovate: repo=PiotrMachowski/lovelace-xiaomi-vacuum-map-card
    - url: /local/plugins/xiaomi-vacuum-map-card/xiaomi-vacuum-map-card.js?v=2.3.2
      type: module
    # renovate: repo=thomasloven/lovelace-card-mod
    - url: /local/plugins/card-mod/card-mod.js?v=4.2.1
      type: module
    # renovate: repo=troinine/ha-weather-forecast-card
    - url: /local/plugins/weather-forecast-card/weather-forecast-card.js?v=1.0.0
      type: module
    # renovate: repo=custom-cards/stack-in-card
    - url: /local/plugins/stack-in-card/stack-in-card.js?v=0.2.0
      type: module
    # renovate: repo=thomasloven/lovelace-layout-card
    - url: /local/plugins/layout-card/layout-card.js?v=2.4.7
      type: module
    # Our own: the dashboard's sizes (docs/dashboard.md).
    - url: /local/styles/dashboard.css?v=1
      type: css
  dashboards:
    lovelace-general:
      mode: yaml
      filename: dashboards/general/dashboard.yaml
      title: General
      icon: mdi:home
      show_in_sidebar: true

# To debug an integration, raise its level with the logger.set_level action
# (e.g. custom_components.xiaomi_miot: debug) instead of changing this.
logger:
  default: warning

# Behind nginx on the same host, so only loopback may set X-Forwarded-For.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - ::1
    - 127.0.0.1
  ip_ban_enabled: true
  login_attempts_threshold: 5

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
