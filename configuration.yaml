# These are from default_config, with the ones that I don't need
# commented out. It would be nice if the default_config: could have
# an exclude list, to stay in sync with the distributed defaults,
# but currently this is not possible.
#assist_pipeline:
backup:
#bluetooth:
config:
#conversation:
dhcp:
#energy:
#go2rtc:
#history:
homeassistant_alerts:
#cloud:
image_upload:
#logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
#usage_prediction:
usb:
webhooks:
#zeroconf:


# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  # Bump ?v= on every card update so browsers drop the cached file
  # (see docs/vendored.md).
  resources:
    - url: /local/plugins/xiaomi-vacuum-map-card/xiaomi-vacuum-map-card.js?v=2.3.2
      type: module
    - url: /local/plugins/card-mod/card-mod.js?v=4.2.1
      type: module
    - url: /local/plugins/weather-forecast-card/weather-forecast-card.js?v=1.0.0
      type: module
    - url: /local/plugins/stack-in-card/stack-in-card.js?v=0.2.0
      type: module
  dashboards:
    lovelace-general:
      mode: yaml
      filename: dashboards/general/dashboard.yaml
      title: General
      icon: mdi:home
      show_in_sidebar: true

# Only log warnings and errors. To debug an integration temporarily, use the
# logger.set_level action (e.g. custom_components.xiaomi_miot: debug).
logger:
  default: warning

# The home-assistant server lives behind a proxy: nginx on the same host
# so only loopback is trusted to set X-Forwarded-For.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - ::1
    - 127.0.0.1
  ip_ban_enabled: true
  login_attempts_threshold: 5

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
