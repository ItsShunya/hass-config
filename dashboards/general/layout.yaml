# Grid shared by every view (layout-card's custom:grid-layout): a sidebar on
# the left and the view's own content on the right. Each card picks its place
# with `view_layout: grid-area: <name>`, which spans the grid lines named
# <name>-start to <name>-end below:
#   sidebar  the sidebar's background panel (cards/sidebar/background.yaml)
#   top      clock, date and menu (cards/sidebar/top.yaml)
#   bottom   people, pollen and temperatures (cards/sidebar/bottom.yaml)
#   main     the view's content
#
# Named lines are used instead of grid-template-areas because areas can't
# overlap. layout-card gives every card a 4px margin on each side, which would
# leave an 8px gap between the sidebar and main. Starting main 8px before the
# sidebar ends cancels it, so the two touch.
grid-template-columns: >-
  [sidebar-start top-start bottom-start] 312px
  [main-start] 8px
  [sidebar-end top-end bottom-end] 1fr
  [main-end]
# The empty 1fr row pushes the bottom block to the bottom of the screen.
grid-template-rows: >-
  [sidebar-start main-start top-start] auto
  [top-end] 1fr
  [bottom-start] auto
  [bottom-end sidebar-end main-end]
# Fill the view, so the sidebar reaches the bottom of the screen. The view
# already excludes the top bar when kiosk-mode shows it (?disable_km).
height: 100%
# Spacing comes from the cards' own margins. No margin or padding around
# the grid: padding would add to the height, and the grid clips anything
# outside it, like the part of the sidebar panel reaching the screen edge.
margin: 0
padding: 0
mediaquery:
  # Phones: a single column, scrolled as a whole: top, main, bottom. The
  # background panel hides itself at this width.
  "(max-width: 800px)":
    grid-template-columns: >-
      [sidebar-start top-start bottom-start main-start] 100%
      [sidebar-end top-end bottom-end main-end]
    grid-template-rows: >-
      [sidebar-start top-start] auto
      [sidebar-end top-end main-start] auto
      [main-end bottom-start] auto
      [bottom-end]
    # Keep the cards together at the top instead of spreading them out.
    place-content: start stretch
