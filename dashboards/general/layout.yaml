# Grid shared by every view. Cards pick their place with
# `view_layout: grid-area: <name>`, spanning the lines <name>-start to
# <name>-end below:
#   sidebar  background panel (cards/sidebar/background.yaml)
#   top      clock, date and menu (cards/sidebar/top.yaml)
#   bottom   people, pollen and temperatures (cards/sidebar/bottom.yaml)
#   main     the view's content
#
# Named lines instead of grid-template-areas, because areas can't overlap.
# layout-card puts a 4px margin around every card, which would leave an 8px
# gap between the sidebar and main, so main starts 8px early to close it.
grid-template-columns: >-
  [sidebar-start top-start bottom-start] calc(var(--dash-sidebar-width) * var(--dash-px))
  [main-start] 8px
  [sidebar-end top-end bottom-end] 1fr
  [main-end]
# The empty 1fr row pushes the bottom block to the bottom of the screen.
grid-template-rows: >-
  [sidebar-start main-start top-start] auto
  [top-end] 1fr
  [bottom-start] auto
  [bottom-end sidebar-end main-end]
# Fill the view so the sidebar reaches the bottom of the screen. The view's
# height already leaves out the header when ?disable_km shows it.
height: 100%
# Spacing comes from the cards' margins. Padding here would add to the height,
# and with a margin the sidebar panel wouldn't reach the screen edge, since the
# grid clips anything outside it.
margin: 0
padding: 0
mediaquery:
  # Phones: one scrolling column with top, main, then bottom.
  "(max-width: 800px)":
    grid-template-columns: >-
      [sidebar-start top-start bottom-start main-start] 100%
      [sidebar-end top-end bottom-end main-end]
    grid-template-rows: >-
      [sidebar-start top-start] auto
      [sidebar-end top-end main-start] auto
      [main-end bottom-start] auto
      [bottom-end]
    # Keep the cards together at the top instead of spreading them out.
    place-content: start stretch
