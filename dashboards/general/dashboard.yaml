title: General
# Hide Home Assistant's header and sidebar; the menu in cards/sidebar/top.yaml
# replaces them. Add ?disable_km to the URL to get them back (e.g. for Refresh).
kiosk_mode:
  hide_header: true
  hide_sidebar: true
# Spotify Browser: a full-screen overlay that any view can open by navigating
# to #spotify-browser, like the floating button in cards/spotify_button.yaml.
# Storage is in packages/spotify.yaml.
spotify_browser:
  entity: media_player.spotifyplus_shunya
  home:
    pinned: true
  storage:
    script: spotify_browser_store
views:
  - !include views/overview.yaml
  - !include views/cleaning.yaml
  - !include views/calendar.yaml
