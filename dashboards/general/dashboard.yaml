title: General
# Hide Home Assistant's header and sidebar; the menu in cards/sidebar/top.yaml
# replaces them. Add ?disable_km to the URL to get them back (e.g. for Refresh).
kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
  - !include views/overview.yaml
  - !include views/cleaning.yaml
  - !include views/calendar.yaml
  - !include views/music.yaml
